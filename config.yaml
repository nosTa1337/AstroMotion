# Clean StarNet2 layers; no cleanup, sprites or automatic color changes.
preset: cinematic
format: vertical
resolution: 1080p
duration: 30.0
fps: 30
work_long_edge: 3200
max_input_pixels: 120000000
save_layers: true
loop:
  enabled: false
  audio_crossfade_seconds: 4.0
separation:
  executable: null
  mode: auto
  stride: 256
  timeout: 3600.0
  extra_args: []
  blend: screen
  max_negative_error: 0.035
motion:
  zoom: 0.065
  rotation_deg: 1.8
  pan_x: 0.018
  pan_y: -0.012
  parallax: 1.0
  star_zoom_extra: 0.045
  star_rotation_deg: 0.5
  speed: 1.0
  overscan: 1.015
  center_x: 0.5
  center_y: 0.5
effects:
  bloom: 0.0
  glow: 0.0
  vignette: 0.0
  contrast: 1.0
  saturation: 1.0
  grade: 0.0
  twinkle: 0.0
audio:
  mode: none
  file: null
  seed: null
  gain: 0.7
  fade_seconds: 2.0
  sample_rate: 48000
  harmony: original
  transpose: 0
  accents: 0.0
encoding:
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  crf: 18
  preset: medium
  threads: 4
  verify: true
