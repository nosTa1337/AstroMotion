name: Regenerate public demo gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-public-demos.yml'
      - 'astromotion/**'
      - 'scripts/render_photo_demo.py'
      - 'configs/photo_demo.yaml'

permissions:
  contents: write

concurrency:
  group: public-demo-gallery
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run regression suite
        run: |
          python -m compileall -q astromotion scripts
          python -m pytest -q
      - name: Rebuild photos, independent stars, ambient music and GIFs
        run: python scripts/render_photo_demo.py --overwrite --duration 30
      - name: Verify files
        run: |
          test -s examples/real/orion_demo.mp4
          test -s examples/real/pleiades_demo.mp4
          test -s examples/real/orion_preview.gif
          test -s examples/real/pleiades_preview.gif
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 examples/real/orion_demo.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 examples/real/pleiades_demo.mp4
      - name: Publish regenerated demo media to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/real/orion_demo.mp4 examples/real/pleiades_demo.mp4
          git add examples/real/orion_preview.gif examples/real/pleiades_preview.gif
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate public demo videos with independently moving stars"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
