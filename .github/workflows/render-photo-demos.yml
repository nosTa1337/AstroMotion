name: Render AstroMotion photo demos

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/render-photo-demos.yml

permissions:
  contents: write

concurrency:
  group: astromotion-photo-demos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and project dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt -r requirements-dev.txt
          ffmpeg -hide_banner -encoders 2>/dev/null | grep libx264
      - name: Validate approximation regression tests
        run: python -m pytest -q tests/test_demo_separation.py
      - name: Render both 30-second MP4s and GIF previews
        run: python -u scripts/render_photo_demo.py --duration 30 --overwrite
      - name: Validate new media and star particles
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from PIL import Image
          folder = Path("examples/real")
          for stem in ("orion", "pleiades"):
              mp4 = folder / f"{stem}_demo.mp4"
              gif = folder / f"{stem}_preview.gif"
              assert mp4.stat().st_size > 200_000, mp4
              assert gif.stat().st_size > 50_000, gif
              probe = json.loads(subprocess.check_output(["ffprobe", "-v", "error",
                  "-show_format", "-show_streams", "-of", "json", str(mp4)]))
              assert float(probe["format"]["duration"]) >= 29.9, mp4
              assert any(s["codec_name"] == "h264" for s in probe["streams"]), mp4
              assert any(s["codec_name"] == "aac" for s in probe["streams"]), mp4
              with Image.open(gif) as im:
                  assert im.n_frames >= 200, (gif, im.n_frames)
              report = json.loads((folder / f"{stem}_demo_assets" / "render_report.json").read_text())
              count = report["diagnostics"]["demo_approximate_star_cores"]
              assert count >= 10, (stem, count)
              assert report["starfield"]["detected_star_particles"] >= 10, stem
              print(f"{stem}: {count:.0f} detected star cores; video={mp4.stat().st_size:,} bytes; gif={gif.stat().st_size:,} bytes")
          PY
      - name: Update README wording after successful rerender
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          content = p.read_text(encoding="utf-8")
          before = "**Wichtig:** Die bereits hochgeladenen MP4s und GIFs zeigen derzeit noch die ältere 2D-Version. Der aktualisierte Demo-Renderer in `scripts/render_photo_demo.py` bewegt zusätzlich erkannte Sterne unabhängig im Raum und erzeugt beide GIFs neu. Diese OpenCV-Sternabschätzung ist nur eine Demo-Näherung (kein StarNet, keine wissenschaftliche Sternentfernung). Um die Medien zu aktualisieren, das Skript lokal ausführen und anschließend die neu erzeugten MP4/GIF-Dateien committen. Für hochwertige Aufnahmen das Hauptprogramm mit einer echten Starless-Datei verwenden."
          after = "**In den aktuellen Demos bewegen sich aus den Fotos erkannte Sterne unabhängig vom Nebel im Raum.** Die OpenCV-Sternabschätzung ist eine künstlerische Näherung für öffentliche Demos (kein StarNet, keine wissenschaftliche Sternentfernung). Das Demo-Skript aktualisiert beim Rendern MP4s und GIF-Vorschauen. Für hochwertige Aufnahmen das Hauptprogramm mit einer echten Starless-Datei verwenden."
          if before not in content:
              raise ValueError("Expected README placeholder missing; refusing stale documentation")
          p.write_text(content.replace(before, after), encoding="utf-8")
          p = Path("THIRD_PARTY_NOTICES.md")
          content = p.read_text(encoding="utf-8")
          content = content.replace("Demovideos (historische 2D-Version im Repository, neue Demo-Engine mit approximierter Sternbewegung)", "Demovideos mit künstlerisch approximierter Sternbewegung")
          p.write_text(content, encoding="utf-8")
          p = Path("examples/real/README.md")
          content = p.read_text(encoding="utf-8")
          content = content.replace("Die aktuell versionierten MP4/GIF-Dateien wurden mit den angegebenen Seeds erstellt; nach erneutem Rendern werden neue Seeds in den lokalen Render-Berichten festgehalten.", "Jeder neue Export erzeugt seine eigene Ambient-Variante; für eine wiederholbare Variante `--seed ZAHL` verwenden. Die Seeds stehen in den lokal erstellten Render-Berichten.")
          p.write_text(content, encoding="utf-8")
          PY
      - name: Commit generated MP4s, GIFs and matching docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/real/orion_demo.mp4 examples/real/orion_preview.gif examples/real/pleiades_demo.mp4 examples/real/pleiades_preview.gif README.md THIRD_PARTY_NOTICES.md examples/real/README.md
          if git diff --cached --quiet; then
            echo "No changed rendered media"
          else
            git commit -m "Render star-motion photo demos and refreshed GIFs"
            git push origin HEAD:main
          fi
