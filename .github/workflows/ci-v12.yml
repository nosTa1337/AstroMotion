name: AstroMotion v1.2 checks

on:
  push:
    paths:
      - .github/workflows/ci-v12.yml
      - astromotion/**
      - tests/**
      - configs/cinematic_intelligence.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt -r requirements-dev.txt
          ffmpeg -hide_banner -encoders 2>/dev/null | grep libx264
      - name: Unit and integration tests
        run: |
          python -m compileall -q astromotion scripts tests
          python -m pytest -q
      - name: Preview CLI smoke test (genuine paired synthetic stars)
        run: |
          python scripts/create_demo.py
          python main.py --config configs/cinematic_intelligence.yaml \
            --input examples/deep_sky.png \
            --starless examples/deep_sky_starless.png \
            --preview --no-loop \
            --output /tmp/astromotion_v12_preview.mp4 \
            --overwrite
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/astromotion_v12_preview.mp4
          test -s /tmp/astromotion_v12_preview.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/astromotion_v12_preview_assets/render_report.json").read_text())
          assert report["cinematic_intelligence"]["effective_focus_x"] > 0
          assert report["starfield"]["detected_star_particles"] >= 1
          assert abs(report["actual_duration"]-3)<0.1
          print("Cinematic preview verified.")
          PY
