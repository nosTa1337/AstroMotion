name: Publish StarNet previews to README

on:
  push:
    paths:
      - .github/workflows/publish-starnet-demos.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Retrieve finished StarNet render artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 37904491672
          repository: nosTa1337/AstroMotion
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: personal-starnet-*-30s
          path: _starnet_download
          merge-multiple: false

      - name: Verify files and create small full-cycle GIFs
        run: |
          mkdir -p _starnet_release
          for stem in orion pleiades; do
            file=$(find _starnet_download -type f -name "${stem}_starnet_30s.mp4" -print -quit)
            if [ -z "$file" ]; then
              echo "Missing source MP4 for $stem" >&2
              find _starnet_download -type f
              exit 1
            fi
            cp "$file" "_starnet_release/${stem}_starnet_30s.mp4"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "_starnet_release/${stem}_starnet_30s.mp4"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "_starnet_release/${stem}_starnet_30s.mp4"
            ffmpeg -hide_banner -loglevel error -y \
              -i "_starnet_release/${stem}_starnet_30s.mp4" \
              -filter_complex "fps=6,scale=240:-2:flags=lanczos,split[a][b];[a]palettegen=max_colors=48[p];[b][p]paletteuse=dither=bayer:bayer_scale=3" \
              -loop 0 "examples/real/${stem}_preview.gif"
          done
          python - <<'PY'
          from PIL import Image
          for name in ('orion','pleiades'):
              with Image.open('examples/real/'+name+'_preview.gif') as im:
                  assert im.n_frames >= 170, (name,im.n_frames)
                  print(name,im.size,im.n_frames)
          PY

      - name: Publish full 1080p StarNet MP4s as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="demo-starnet-2026-10"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "StarNet2 AstroMotion Video Demos" \
              --notes "30-second personal Seestar S50 Pro / AstroWizard astrophotography examples animated by AstroMotion using separately installed StarNet2. Videos include synthesized ambient music. StarNet2 and its weights are NOT distributed. See THIRD_PARTY_NOTICES.md for the separately applicable license and restrictions." \
              --latest=false
          fi
          gh release upload "$tag" _starnet_release/*.mp4 --clobber

      - name: Update README to real StarNet examples
        run: |
          python - <<'PY'
          from pathlib import Path
          base='https://github.com/nosTa1337/AstroMotion/releases/download/demo-starnet-2026-10'
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          for stem in ('orion','pleiades'):
              old='https://github.com/nosTa1337/AstroMotion/raw/refs/heads/main/examples/real/'+stem+'_demo.mp4'
              s=s.replace(old,base+'/'+stem+'_starnet_30s.mp4')
          s=s.replace('Jeweils **30 Sekunden · 720 × 1280 · 30 FPS · H.264/AAC**, ruhige Bildanimation', 'Jeweils **30 Sekunden · 1080 × 1920 · 30 FPS · H.264/AAC**, ruhige Bildanimation')
          old='**In den aktuellen Demos bewegen sich aus den Fotos erkannte Sterne unabhängig vom Nebel im Raum.** Die OpenCV-Sternabschätzung ist eine künstlerische Näherung für öffentliche Demos (kein StarNet, keine wissenschaftliche Sternentfernung). Das Demo-Skript aktualisiert beim Rendern MP4s und GIF-Vorschauen. Für hochwertige Aufnahmen das Hauptprogramm mit einer echten Starless-Datei verwenden.'
          new='**Die eingebetteten GIFs zeigen echte StarNet2-Sterntrennung und unabhängigen 2,5D-Sternflug.** Grundlage sind die eigenen Seestar S50 Pro / AstroWizard-Aufnahmen. Für die Bewegungen werden künstlerisch verteilte Tiefenwerte genutzt – keine wissenschaftlich ermittelten Entfernungen. Die vollständigen MP4s mit jeweils eigener lokal erzeugter Ambient-Musik stehen in [GitHub Releases](https://github.com/nosTa1337/AstroMotion/releases/tag/demo-starnet-2026-10).'
          if old not in s:
              raise ValueError('StarNet gallery anchor missing; refuse stale README rewrite')
          s=s.replace(old,new)
          start=s.index('### Persönliche StarNet-Renderings (getrennt von der öffentlichen Demo)')
          end=s.index('Neu rendern (aktivierte Python-Umgebung',start)
          section="""### Mit StarNet2 gerenderte Beispielvideos

Diese GIF-Vorschauen stammen aus zwei **echten StarNet2-Renderings** (30 Sekunden, 1080p, eigenständige Sternbewegung, 2,5D-Flug, Bloom und dezente Objektbeschriftung). MP4-Dateien samt zufällig synthetisierter Ambient-Musik findest du über die Links oberhalb. Originalaufnahmen: **Seestar S50 Pro**, bearbeitet mit **AstroWizard**.

**Lizenzhinweis:** StarNet2 ist eine extern lizenzierte Komponente, **nicht** Teil der MIT-Lizenz von AstroMotion. Die Lizenzrevision vom 07.09.2026 enthält Einschränkungen zur Verwendung von StarNet-Ausgaben als Assets anderer Softwareprodukte. Die öffentliche Darstellung dieser Beispielvideos sollte vor einer dauerhaften Weiterverwendung mit dem Anbieter geklärt werden; die Open-Source-Lizenz von AstroMotion hebt diese Einschränkungen nicht auf. [Details](THIRD_PARTY_NOTICES.md).

Für ein eigenes StarNet-Rendering zuerst die [offizielle StarNet2-CLI](https://starnetastro.com/cli-tools/starnet/) separat installieren, ihre Lizenz akzeptieren und dann das Hauptprogramm mit `--starnet` starten. [Workflow mit persönlichem MP4/GIF-Export](.github/workflows/personal-starnet-render.yml).

"""
          s=s[:start]+section+s[end:]
          s=s.replace('Neu rendern (aktivierte Python-Umgebung, funktioniert auch unter Windows):',
                      'Optional: ältere OpenCV-Demos ohne StarNet erzeugen (aktivierte Python-Umgebung):')
          s=s.replace('Dabei entsteht jedes Mal eine neue, ähnliche Ambient-Variante. `--seed 1234` macht die Musik wiederholbar;',
                      'Die ältere OpenCV-Demo ist nur ein Fallback, nicht die oben eingebettete StarNet-Galerie. `--seed 1234` macht die Musik wiederholbar;')
          p.write_text(s,encoding='utf-8')

          p=Path('examples/real/README.md')
          p.write_text("""# AstroMotion – eigene Seestar S50 Pro Aufnahmen

Die Originalfotos wurden mit **Seestar S50 Pro** aufgenommen und in **AstroWizard** bearbeitet. Fotograf: **Philipp / nosTa1337**; die Originalfotos dürfen verwendet werden, Quellenangabe willkommen.

## StarNet2-Video-Galerie

| Himmelsobjekt | Eigenes Originalfoto | Animierte Vorschau | 30s MP4 mit Ambient-Musik |
|---|---|---|---|
| Orionnebel · M42 | [orion.jpg](orion.jpg) | [orion_preview.gif](orion_preview.gif) | [StarNet2-Video](https://github.com/nosTa1337/AstroMotion/releases/download/demo-starnet-2026-10/orion_starnet_30s.mp4) |
| Plejaden · M45 | [pleiades.jpg](pleiades.jpg) | [pleiades_preview.gif](pleiades_preview.gif) | [StarNet2-Video](https://github.com/nosTa1337/AstroMotion/releases/download/demo-starnet-2026-10/pleiades_starnet_30s.mp4) |

Die Vorschau-GIFs basieren auf der **echten StarNet2-Sterntrennung** und 2,5D-Animation von AstroMotion. Die 30-Sekunden-Videos sind in 1080 × 1920 mit 30 FPS, H.264/AAC und unabhängig erzeugter Ambient-Musik gerendert. Die Original-JPEGs bleiben unverändert.

**Wichtig zu Lizenzen:** StarNet2 unterliegt einer separaten Lizenz (nicht MIT). Die Lizenzrevision vom 07.09.2026 enthält Einschränkungen zur Nutzung von Outputs als Assets anderer Softwareprodukte. Die Rechte an den eigenen Eingabefotos liegen beim Fotografen; daraus folgt nicht automatisch die freie Weiterverwendbarkeit jedes StarNet2-Outputs als Produkt-Demo. Siehe [THIRD_PARTY_NOTICES.md](../../THIRD_PARTY_NOTICES.md). StarNet-Code und -Modelle sind nicht im Repository enthalten.

Die vorherigen OpenCV-Demovideos ohne StarNet bleiben als `orion_demo.mp4` und `pleiades_demo.mp4` zum technischen Vergleich im Git-Verlauf; das Demo-Skript `scripts/render_photo_demo.py` erzeugt auf Wunsch neue OpenCV-Versionen und ersetzt dann die GIFs.
""",encoding='utf-8')

          p=Path('THIRD_PARTY_NOTICES.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Demovideos mit künstlerisch approximierter Sternbewegung', 'Demovideos einschließlich StarNet2-bearbeiteter GIF-Vorschauen (separat lizenzierte Verarbeitung)')
          old='Die in der öffentlichen README eingebetteten Foto-Demos verwenden daher **kein StarNet**.'
          new='Die README zeigt nun auch mit StarNet2 bearbeitete eigene Astrofotografie-Vorschauen. Achtung: Absatz 5 der Lizenz begrenzt gerade die Verwendung von StarNet2-Ausgaben als Produktassets und zu Entwicklungs-/Testzwecken; die Veröffentlichung solcher Medien im Projekt-README kann deshalb eine separate Genehmigung des Rechteinhabers erfordern. Der MIT-Status von AstroMotion ändert das nicht.'
          if old not in s:
              raise ValueError('StarNet notices anchor missing')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit generated StarNet GIF previews and updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md THIRD_PARTY_NOTICES.md examples/real/README.md examples/real/orion_preview.gif examples/real/pleiades_preview.gif
          git commit -m "Show StarNet2 animated preview GIFs and 1080p demo video links in README"
          git pull --rebase origin main
          git push origin HEAD:main
