name: Code checks (no video rendering)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source code (read-only)
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q astromotion scripts tests

      - name: Run non-video tests only
        run: |
          # "video_render" marks integration tests that encode MP4s.
          # Those tests are local-only and must NOT run in GitHub Actions.
          python -m pytest -q -m "not video_render"

      - name: Ensure tracked photos, GIFs and MP4s are unchanged
        run: |
          git diff --exit-code -- '*.jpg' '*.jpeg' '*.png' '*.gif' '*.mp4' '*.tif' '*.tiff'
          echo "Media files unchanged. This workflow creates no videos and uploads nothing."
