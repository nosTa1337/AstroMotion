# Clean StarNet2 layers; no cleanup, sprites or automatic color changes.
preset: cinematic
format: vertical
resolution: 1080p
duration: 30.0
fps: 30
motion:
  zoom: 0.1
  rotation_deg: 0.7
  pan_x: 0.006
  pan_y: -0.004
  parallax: 1.0
  star_zoom_extra: 0.025
  star_rotation_deg: 0.0
  overscan: 1.02
effects:
  bloom: 0.0
  glow: 0.0
  vignette: 0.0
  contrast: 1.0
  saturation: 1.0
  grade: 0.0
  twinkle: 0.0
audio:
  mode: ambient
  seed: null
  harmony: floating
  transpose: 0
  accents: 0.45
separation:
  extra_args:
  - --upsample
loop:
  enabled: true
  audio_crossfade_seconds: 4.0
