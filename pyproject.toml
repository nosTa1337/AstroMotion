[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astromotion"
version = "1.2.0"
description = "Local cinematic parallax videos from deep-sky photographs"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.packages.find]
include = ["astromotion*"]

[project.scripts]
astromotion = "astromotion.cli:main"

[tool.pytest.ini_options]
markers = ["video_render: integration test that produces an MP4 or other rendered video; excluded from GitHub Actions"]
testpaths = ["tests"]
pythonpath = ["."]
